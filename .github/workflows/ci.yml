name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON example files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path(".").rglob("*.json"):
              if ".git" not in path.parts:
                  json.loads(path.read_text(encoding="utf-8"))
                  print(f"OK {path}")
          PY
      - name: Check required documentation and examples
        run: |
          test -s README.md
          test -s docs/language-spec.md
          test -s docs/roadmap.md
          test -s docs/security.md
          test -s examples/logic.brain
          test -s examples/oop.brain
